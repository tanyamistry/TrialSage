    gold_filter_sql: "SELECT nct_id FROM v_trials WHERE overall_status = 'RECRUITING' AND phases @> ARRAY['PHASE1'] AND therapeutic_areas @> ARRAY['oncology'] AND 'California' = ANY(states)"
