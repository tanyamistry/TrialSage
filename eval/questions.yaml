      terms: [myocardial infarction, acute coronary]
      polarity: exclusion

  - id: h05
    route: hybrid
    reviewed: false
    question: "Which phase 2 oncology trials in New York mention prior immunotherapy?"
    gold_filter_sql: "SELECT nct_id FROM v_trials WHERE phases @> ARRAY['PHASE2'] AND therapeutic_areas @> ARRAY['oncology'] AND 'New York' = ANY(states)"
    expect:
      terms: [immunotherapy, checkpoint, "pd-1"]

  - id: h06
    route: hybrid
    reviewed: false
    question: "Which recruiting diabetes trials mention an HbA1c requirement?"
    gold_filter_sql: "SELECT nct_id FROM v_trials WHERE overall_status = 'RECRUITING' AND therapeutic_areas @> ARRAY['diabetes']"
