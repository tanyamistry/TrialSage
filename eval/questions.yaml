  - id: h08
    route: hybrid
    reviewed: false
    question: "Which recruiting phase 2 trials in Texas require an ECOG performance status of 0 or 1?"
    gold_filter_sql: "SELECT nct_id FROM v_trials WHERE overall_status = 'RECRUITING' AND phases @> ARRAY['PHASE2'] AND 'Texas' = ANY(states)"
