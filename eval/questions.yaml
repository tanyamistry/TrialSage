    question: "Which phase 1 trials mention prior radiotherapy?"
    gold_filter_sql: "SELECT nct_id FROM v_trials WHERE phases @> ARRAY['PHASE1']"
    expect:
      terms: [radiotherapy, radiation, irradiat]

  - id: h12
    route: hybrid
